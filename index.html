<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dictionary</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .result-container {
            margin-top: 20px;
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .word-title {
            font-size: 2rem;
            text-transform: capitalize;
        }

        .phonetic {
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .part-of-speech {
            font-weight: bold;
            font-style: italic;
            color: var(--text-main);
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 5px;
        }

        .definitions {
            list-style-type: disc;
            padding-left: 20px;
            color: var(--text-muted);
        }

        .definitions li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .error {
            text-align: center;
            color: #ef4444;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dictionary App</h1>
        <div class="search-box">
            <input type="text" id="word-input" placeholder="Type a word (e.g., hello)..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>
        <div id="result" class="result-container">
            </div>
    </div>

    <script>
        const inputField = document.getElementById('word-input');
        const searchBtn = document.getElementById('search-btn');
        const resultContainer = document.getElementById('result');

        // Trigger search when clicking the button
        searchBtn.addEventListener('click', fetchDictionaryData);

        // Trigger search when pressing 'Enter' on the keyboard
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchDictionaryData();
            }
        });

        async function fetchDictionaryData() {
            const word = inputField.value.trim();
            
            // Don't search if the input is empty
            if (!word) return;

            // Show loading state
            resultContainer.innerHTML = `<p class="loading">Searching for "${word}"...</p>`;

            try {
                // Fetch data from the Free Dictionary API
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                
                if (!response.ok) {
                    throw new Error("Word not found");
                }

                const data = await response.json();
                displayResult(data[0]);

            } catch (error) {
                // Handle errors (like word not existing)
                resultContainer.innerHTML = `
                    <div class="error">
                        <p>Oops! We couldn't find the word "${word}".</p>
                        <p style="font-size: 0.9rem; margin-top: 5px;">Please check the spelling and try again.</p>
                    </div>
                `;
            }
        }

        function displayResult(data) {
            // Extract the word and phonetic spelling
            const word = data.word;
            const phonetic = data.phonetic || (data.phonetics.find(p => p.text) ? data.phonetics.find(p => p.text).text : "");

            let html = `
                <div class="word-header">
                    <h2 class="word-title">${word}</h2>
                </div>
                ${phonetic ? `<p class="phonetic">${phonetic}</p>` : ''}
            `;

            // Loop through the different parts of speech (noun, verb, etc.)
            data.meanings.forEach(meaning => {
                html += `
                    <div class="meaning-group">
                        <p class="part-of-speech">${meaning.partOfSpeech}</p>
                        <ul class="definitions">
                `;

                // Limit to the first 3 definitions per part of speech to keep it clean
                meaning.definitions.slice(0, 3).forEach(def => {
                    html += `<li>${def.definition}</li>`;
                });

                html += `
                        </ul>
                    </div>
                `;
            });

            // Update the webpage with the generated HTML
            resultContainer.innerHTML = html;
        }
    </script>

</body>
</html>
