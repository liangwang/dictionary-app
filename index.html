<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFF8F0">
    <title>Kids Dictionary</title>
    <style>
        :root {
            --primary-color: #5B9BD5;
            --bg-color: #FFF8F0;
            --card-bg: #ffffff;
            --text-main: #2D2D2D;
            --text-muted: #7A7A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        html {
            overflow-y: scroll;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: 20px;
            padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 5vh;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 2rem;
            color: var(--primary-color);
        }

        /* Password Gate */
        #password-gate {
            text-align: center;
            padding: 40px 20px;
        }

        #password-gate label {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        #password-gate input {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            text-align: center;
        }

        #password-gate input:focus {
            border-color: var(--primary-color);
        }

        #password-gate button {
            display: block;
            margin: 16px auto 0;
            padding: 16px 40px;
            font-size: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            touch-action: manipulation;
            transition: background-color 0.2s, transform 0.1s;
        }

        #password-gate button:active {
            transform: scale(0.96);
        }

        #password-error {
            color: #ef4444;
            font-size: 0.95rem;
            margin-top: 12px;
            min-height: 1.2em;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-btn {
            padding: 16px;
            width: 56px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:active {
            transform: scale(0.96);
            background-color: #4a8ac4;
        }

        .search-btn svg {
            width: 24px;
            height: 24px;
        }

        .mic-btn {
            padding: 16px;
            width: 56px;
            background: none;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
            transition: border-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-muted);
        }

        .mic-btn:active {
            transform: scale(0.96);
        }

        .mic-btn.listening {
            border-color: #ef4444;
            animation: pulse 1s ease-in-out infinite;
        }

        .mic-btn.listening svg {
            fill: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        /* Result Styles */
        .result-container {
            margin-top: 20px;
        }

        .word-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .word-title {
            font-size: 2.4rem;
            text-transform: capitalize;
            letter-spacing: -0.5px;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            touch-action: manipulation;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
        }

        .audio-btn:hover {
            background-color: rgba(91, 155, 213, 0.1);
        }

        .audio-btn:active {
            background-color: rgba(91, 155, 213, 0.2);
        }

        .audio-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--primary-color);
        }

        .phonetic {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 24px;
        }

        .part-of-speech {
            font-weight: bold;
            font-style: italic;
            color: var(--text-main);
            margin-top: 24px;
            margin-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
            font-size: 1.1rem;
        }

        .definitions {
            list-style-type: none;
            padding-left: 0;
            color: var(--text-muted);
        }

        .definitions li {
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: 1.15rem;
            position: relative;
            padding-left: 20px;
        }

        .definitions li::before {
            content: "\2022";
            color: var(--primary-color);
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .example {
            display: block;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 1.05rem;
        }

        .error {
            text-align: center;
            color: #ef4444;
            font-weight: bold;
            padding: 20px;
            background: #fef2f2;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 20px;
        }

        /* Spelling Suggestions */
        .suggestions {
            text-align: center;
            padding: 20px;
        }

        .suggestions p {
            margin-bottom: 16px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .suggestions .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .suggestion-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .suggestion-pill {
            padding: 12px 20px;
            min-height: 48px;
            background-color: var(--bg-color);
            border: 2px solid var(--primary-color);
            border-radius: 24px;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
        }

        .suggestion-pill:active {
            transform: scale(0.96);
            background-color: var(--primary-color);
            color: white;
        }

        /* Phone: edge-to-edge, bigger touch targets */
        @media (max-width: 480px) {
            body {
                padding: 0;
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .container {
                margin-top: 0;
                border-radius: 0;
                box-shadow: none;
                padding: 20px 16px;
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }

            h1 {
                font-size: 1.6rem;
                margin-bottom: 16px;
            }

            .word-title {
                font-size: 2rem;
            }

            .search-box {
                position: sticky;
                top: 0;
                z-index: 10;
                background-color: var(--card-bg);
                padding: 8px 0 16px;
                margin-bottom: 16px;
            }

            .search-box input {
                padding: 14px;
            }

            .search-btn {
                width: 52px;
            }

            .definitions li {
                font-size: 1.05rem;
                padding-left: 16px;
            }

            .suggestion-pill {
                padding: 14px 22px;
                font-size: 1.05rem;
            }

            #password-gate {
                padding: 60px 16px 40px;
            }
        }

        /* Tablet: wider card, more padding */
        @media (min-width: 481px) and (max-width: 1024px) {
            .container {
                max-width: 640px;
                padding: 36px 28px;
            }

            .search-box input {
                padding: 18px;
            }

            .search-btn {
                width: 60px;
                padding: 18px;
            }

            .search-btn svg {
                width: 26px;
                height: 26px;
            }

            .audio-btn {
                min-width: 52px;
                min-height: 52px;
            }

            .audio-btn svg {
                width: 32px;
                height: 32px;
            }

            .suggestion-pill {
                padding: 14px 24px;
                min-height: 52px;
                font-size: 1.05rem;
            }

            #password-gate button {
                padding: 18px 48px;
                font-size: 1.1rem;
            }

            #password-gate input {
                padding: 18px;
                max-width: 340px;
            }
        }

        /* Landscape phone: reduce vertical spacing */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                margin-top: 0;
                padding-top: 12px;
                padding-bottom: 12px;
            }

            h1 {
                margin-bottom: 12px;
                font-size: 1.4rem;
            }

            #password-gate {
                padding: 20px 16px;
            }

            .part-of-speech {
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kids Dictionary</h1>

        <!-- Password Gate -->
        <div id="password-gate">
            <label for="password-input">Family Password</label>
            <input type="password"
                   id="password-input"
                   placeholder="Enter password"
                   autocomplete="off">
            <button id="password-btn">Submit</button>
            <p id="password-error"></p>
        </div>

        <!-- Main Content (hidden until authenticated) -->
        <div id="main-content" style="display:none">
            <div class="search-box">
                <input type="search"
                       id="word-input"
                       placeholder="Type a word..."
                       autocomplete="off"
                       autocorrect="off"
                       autocapitalize="none"
                       spellcheck="false">
                <button class="search-btn" id="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <button class="mic-btn" id="mic-btn" aria-label="Voice search" style="display:none">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
            </div>
            <div id="result" class="result-container"></div>
        </div>
    </div>

    <script>
        // DOM elements
        const passwordGate = document.getElementById('password-gate');
        const passwordInput = document.getElementById('password-input');
        const passwordBtn = document.getElementById('password-btn');
        const passwordError = document.getElementById('password-error');
        const mainContent = document.getElementById('main-content');
        const inputField = document.getElementById('word-input');
        const searchBtn = document.getElementById('search-btn');
        const micBtn = document.getElementById('mic-btn');
        const resultContainer = document.getElementById('result');

        // Speech recognition setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            micBtn.style.display = 'flex';
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const spoken = event.results[0][0].transcript.trim().split(/\s+/)[0].toLowerCase();
                inputField.value = spoken;
                micBtn.classList.remove('listening');
                fetchDictionaryData();
            };

            recognition.onerror = function() {
                micBtn.classList.remove('listening');
            };

            recognition.onend = function() {
                micBtn.classList.remove('listening');
            };

            micBtn.addEventListener('click', function() {
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    micBtn.classList.add('listening');
                    recognition.start();
                }
            });
        }

        // Password flow
        function getPassword() {
            return localStorage.getItem('familyPassword');
        }

        function showMain() {
            passwordGate.style.display = 'none';
            mainContent.style.display = 'block';
            inputField.focus();
        }

        function showPasswordGate() {
            localStorage.removeItem('familyPassword');
            passwordGate.style.display = 'block';
            mainContent.style.display = 'none';
            passwordError.textContent = '';
            passwordInput.value = '';
        }

        // Check for saved password on load
        if (getPassword()) {
            showMain();
        }

        passwordBtn.addEventListener('click', submitPassword);
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitPassword();
            }
        });

        function submitPassword() {
            const pw = passwordInput.value.trim();
            if (!pw) return;
            localStorage.setItem('familyPassword', pw);
            showMain();
        }

        // Search flow
        searchBtn.addEventListener('click', fetchDictionaryData);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                fetchDictionaryData();
            }
        });

        function searchWord(word) {
            inputField.value = word;
            fetchDictionaryData();
        }

        async function fetchDictionaryData() {
            const word = inputField.value.trim();
            if (!word) return;

            // Dismiss keyboard on iPad/iOS
            inputField.blur();

            resultContainer.innerHTML = '<p class="loading">Looking it up\u2026</p>';

            const password = getPassword();
            if (!password) {
                showPasswordGate();
                return;
            }

            try {
                const response = await fetch('/api/define?word=' + encodeURIComponent(word), {
                    headers: { 'Authorization': 'Bearer ' + password }
                });

                if (response.status === 401) {
                    showPasswordGate();
                    passwordError.textContent = 'Password expired. Please enter it again.';
                    passwordInput.parentElement.classList.add('shake');
                    setTimeout(() => passwordInput.parentElement.classList.remove('shake'), 400);
                    return;
                }

                if (!response.ok) throw new Error('Request failed');

                const data = await response.json();

                // MW returns array of strings for spelling suggestions
                if (data.length > 0 && typeof data[0] === 'string') {
                    displaySuggestions(word, data);
                } else if (data.length > 0 && typeof data[0] === 'object') {
                    displayResult(data);
                } else {
                    displayNotFound(word);
                }
            } catch (error) {
                displayNotFound(word);
            }
        }

        // MW markup stripping
        function stripMarkup(text) {
            if (!text) return '';
            return text
                .replace(/\{bc\}/g, ': ')
                .replace(/\{it\}(.*?)\{\/it\}/g, '<em>$1</em>')
                .replace(/\{b\}(.*?)\{\/b\}/g, '$1')
                .replace(/\{sc\}(.*?)\{\/sc\}/g, '$1')
                .replace(/\{sx\|([^|]*)\|[^}]*\}/g, '$1')
                .replace(/\{d_link\|([^|]*)\|[^}]*\}/g, '$1')
                .replace(/\{a_link\|([^}]*)\}/g, '$1')
                .replace(/\{dxt\|[^}]*\}/g, '')
                .replace(/\{[^}]*\}/g, '');
        }

        function stripMarkupText(text) {
            if (!text) return '';
            return text
                .replace(/\{bc\}/g, ': ')
                .replace(/\{it\}(.*?)\{\/it\}/g, '$1')
                .replace(/\{b\}(.*?)\{\/b\}/g, '$1')
                .replace(/\{sc\}(.*?)\{\/sc\}/g, '$1')
                .replace(/\{sx\|([^|]*)\|[^}]*\}/g, '$1')
                .replace(/\{d_link\|([^|]*)\|[^}]*\}/g, '$1')
                .replace(/\{a_link\|([^}]*)\}/g, '$1')
                .replace(/\{dxt\|[^}]*\}/g, '')
                .replace(/\{[^}]*\}/g, '');
        }

        // Audio
        function getAudioUrl(audio) {
            if (!audio) return null;
            let subdir;
            if (audio.startsWith('bix')) {
                subdir = 'bix';
            } else if (audio.startsWith('gg')) {
                subdir = 'gg';
            } else if (/^[0-9\W]/.test(audio)) {
                subdir = 'number';
            } else {
                subdir = audio.charAt(0);
            }
            return 'https://media.merriam-webster.com/audio/prons/en/us/mp3/' + subdir + '/' + audio + '.mp3';
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play();
        }

        // Parse MW definitions from sseq
        function parseDefinitions(entry) {
            const defs = [];
            if (!entry.def || !entry.def[0] || !entry.def[0].sseq) return defs;

            const sseq = entry.def[0].sseq;
            for (const senseGroup of sseq) {
                for (const item of senseGroup) {
                    if (item[0] === 'sense') {
                        const sense = item[1];
                        const dt = sense.dt;
                        if (!dt) continue;

                        let defText = '';
                        let example = '';

                        for (const part of dt) {
                            if (part[0] === 'text') {
                                defText = stripMarkup(part[1]);
                            }
                            if (part[0] === 'vis' && part[1] && part[1].length > 0) {
                                example = stripMarkupText(part[1][0].t);
                            }
                        }

                        if (defText) {
                            defs.push({ text: defText, example: example });
                        }
                    }
                }
            }
            return defs;
        }

        // Display definitions
        function displayResult(data) {
            const entry = data[0];
            const headword = (entry.hwi && entry.hwi.hw) ? entry.hwi.hw.replace(/\*/g, '\u00B7') : '';
            const phonetic = (entry.hwi && entry.hwi.prs && entry.hwi.prs[0] && entry.hwi.prs[0].mw) ? entry.hwi.prs[0].mw : '';
            const audioFile = (entry.hwi && entry.hwi.prs && entry.hwi.prs[0] && entry.hwi.prs[0].sound && entry.hwi.prs[0].sound.audio) ? entry.hwi.prs[0].sound.audio : null;
            const audioUrl = getAudioUrl(audioFile);
            const partOfSpeech = entry.fl || '';

            // Build word header
            const header = document.createElement('div');
            header.className = 'word-header';

            const title = document.createElement('h2');
            title.className = 'word-title';
            title.textContent = headword;
            header.appendChild(title);

            if (audioUrl) {
                const audioBtn = document.createElement('button');
                audioBtn.className = 'audio-btn';
                audioBtn.setAttribute('aria-label', 'Play pronunciation');
                audioBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
                audioBtn.addEventListener('click', function() { playAudio(audioUrl); });
                header.appendChild(audioBtn);
            }

            resultContainer.innerHTML = '';
            resultContainer.appendChild(header);

            if (phonetic) {
                const phoneticEl = document.createElement('p');
                phoneticEl.className = 'phonetic';
                phoneticEl.textContent = phonetic;
                resultContainer.appendChild(phoneticEl);
            }

            // Process all entries that share definitions
            const entries = data.filter(e => typeof e === 'object' && e.def);

            for (const ent of entries) {
                const pos = ent.fl || '';
                const definitions = parseDefinitions(ent);
                if (definitions.length === 0) continue;

                const posEl = document.createElement('p');
                posEl.className = 'part-of-speech';
                posEl.textContent = pos;
                resultContainer.appendChild(posEl);

                const ul = document.createElement('ul');
                ul.className = 'definitions';

                definitions.slice(0, 3).forEach(function(def) {
                    const li = document.createElement('li');
                    // Use innerHTML for definition since it may contain <em> from markup
                    li.innerHTML = def.text;
                    if (def.example) {
                        const exSpan = document.createElement('span');
                        exSpan.className = 'example';
                        exSpan.textContent = '"' + def.example + '"';
                        li.appendChild(exSpan);
                    }
                    ul.appendChild(li);
                });

                resultContainer.appendChild(ul);
            }
        }

        // Display spelling suggestions
        function displaySuggestions(word, suggestions) {
            resultContainer.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'suggestions';

            const msg = document.createElement('p');
            msg.textContent = 'Hmm, we couldn\u2019t find that word.';
            wrapper.appendChild(msg);

            const subtitle = document.createElement('p');
            subtitle.className = 'subtitle';
            subtitle.textContent = 'Did you mean\u2026';
            wrapper.appendChild(subtitle);

            const pills = document.createElement('div');
            pills.className = 'suggestion-pills';

            suggestions.slice(0, 8).forEach(function(suggestion) {
                const btn = document.createElement('button');
                btn.className = 'suggestion-pill';
                btn.textContent = suggestion;
                btn.addEventListener('click', function() { searchWord(suggestion); });
                pills.appendChild(btn);
            });

            wrapper.appendChild(pills);
            resultContainer.appendChild(wrapper);
        }

        // Display not found (no suggestions)
        function displayNotFound(word) {
            resultContainer.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'error';
            const p1 = document.createElement('p');
            p1.textContent = 'Oops! We couldn\u2019t find that word.';
            const p2 = document.createElement('p');
            p2.style.fontSize = '0.9rem';
            p2.style.marginTop = '5px';
            p2.style.fontWeight = 'normal';
            p2.textContent = 'Please check the spelling and try again.';
            div.appendChild(p1);
            div.appendChild(p2);
            resultContainer.appendChild(div);
        }
    </script>

</body>
